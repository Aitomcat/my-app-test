name: 运行测试与覆盖率检查

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 安装依赖
      run: npm ci

    - name: 运行测试并检查覆盖率
      run: npx jest --coverage
