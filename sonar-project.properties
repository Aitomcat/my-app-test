sonar.projectKey=aitomcat_my-app-test
sonar.organization=aitomcat

sonar.projectName=my-app-test
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

# 排除 node_modules
sonar.exclusions=node_modules/**

# 精确指定测试文件：只匹配 *.test.js 文件
sonar.tests=src
sonar.test.inclusions=**/*.test.js

# 覆盖率报告路径
sonar.javascript.lcov.reportPaths=coverage/lcov.info
